[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "st-vram-proxy"
version = "0.1.0"
description = "Local VRAM handoff broker for SillyTavern, KoboldCpp, and ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
st-vram-proxy = "st_proxy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/st_proxy"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110", "ASYNC240"]
